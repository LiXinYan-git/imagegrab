<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · 图提取 ImageGrab</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 48px 20px; }
  .nf-code {
    font-size: clamp(64px, 14vw, 120px); font-weight: 800; line-height: 1;
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf h1 { font-size: clamp(20px, 3vw, 28px); margin: 16px 0 8px; }
  .nf p { color: var(--muted); margin-bottom: 24px; }
</style>
</head>
<body>
  <div class="nf">
    <div>
      <div class="nf-code">404</div>
      <h1>这个页面走丢了</h1>
      <p>你访问的地址不存在，或者已经被移动。</p>
      <a class="btn btn-primary" href="./">返回首页</a>
    </div>
  </div>
</body>
</html>
